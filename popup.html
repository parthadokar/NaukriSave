<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaukriSave</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <span class="logo-dot"></span>
      <h1>NaukriSave</h1>
    </div>
    <button id="clearAll" class="btn-ghost" title="Clear all saved searches">Clear all</button>
  </header>

  <main id="searchList">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🔍</div>
      <p>No saved searches yet.</p>
      <span>Search on Naukri.com and they'll appear here.</span>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
